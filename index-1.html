/* ---------- carnet logic ---------- */
function def(c){
 if(c.type==='epargne')return{n:45,fee:500,amt:function(i){return i*c.plan},kind:'day',name:'Épargne Plus',branch:'epargne',unit:'Jou'};
 if(c.type==='epay')return{n:200,fee:0,amt:function(){return c.value},kind:'case',name:'Carnet Épargne',branch:'carnet',unit:'Kare'};
 return{n:15,fee:1500,amt:function(){return 1500},kind:'wk',name:'Pen ak ze',branch:'saveurs',unit:'Samdi'}
}
function st(c,i){var a=S.payments.filter(function(p){return p.carnetId===c.id&&p.kind!=='order'&&p.index!=null&&i>=p.index&&i<p.index+(p.count||1)});
 return a.some(function(p){return p.status==='valid'})?'valid':a.some(function(p){return p.status==='pending'})?'pending':'none'}
function nextStep(c){var D=def(c);for(var i=D.fee?0:1;i<=D.n;i++){var s=st(c,i);if(s==='valid')continue;return{i:i,s:s,amt:i===0?D.fee:D.amt(i)}}return null}
function validCount(c){var D=def(c),k=0;for(var i=1;i<=D.n;i++)if(st(c,i)==='valid')k++;return k}
function paidSum(c){var D=def(c),t=0;for(var i=1;i<=D.n;i++)if(st(c,i)==='valid')t+=D.amt(i);return t}
function totalSum(c){var D=def(c),t=0;for(var i=1;i<=D.n;i++)t+=D.amt(i);return t}
function feeDate(c){var p=S.payments.find(function(p){return p.carnetId===c.id&&p.index===0&&p.status==='valid'&&p.kind!=='order'});return p?p.validatedAt:null}
function dateFor(c,i){var f=feeDate(c);if(!f)return null;var s=addDays(f,1);
 if(c.type==='epargne')return addDays(s,i-1);
 if(c.type==='pen'){var d=new Date(s);d.setHours(12,0,0,0);var add=(6-d.getDay()+7)%7;return addDays(s,add+(i-1)*7)}
 return null}
function stepsFor(c,i,amount){var D=def(c),n=0,t=0;for(var k=i;k<=D.n;k++){t+=D.amt(k);if(t<=amount)n++;else break}return Math.max(1,n)}
function costFor(c,i,count){var D=def(c),t=0;for(var k=i;k<i+count&&k<=D.n;k++)t+=D.amt(k);return t}
function rangeLabel(c,p){var cnt=p.count||1;if(p.index===0||cnt<=1)return stepLabel(c,p.index);return def(c).unit.toLowerCase()+' '+p.index+' a '+(p.index+cnt-1)}
function estText(x,amount){var c=S.carnets.find(function(c){return c.id===x.carnetId}),n=stepsFor(c,x.index,amount);return 'Sa fè apeprè <b>'+n+' '+x.unit+'</b> ('+x.index+(n>1?' a '+(x.index+n-1):'')+'). Administratè a konfime kantite a.'}
function cntField(p){var c=S.carnets.find(function(c){return c.id===p.carnetId});if(p.kind==='order'||!c||c.type==='pen'||p.index===0)return '';var D=def(c),u=D.unit.toLowerCase();return '<div class="field"><label for="cnt-'+p.id+'">Kantite '+u+' kliyan an peye</label><input id="cnt-'+p.id+'" type="number" min="1" max="'+(D.n-p.index+1)+'" value="'+(p.count||1)+'"><small>Kliyan an voye '+fmt(p.amount)+', li kòmanse nan '+u+' '+p.index+'. Chanje kantite a si li pa koresponn.</small></div>'}
function stepLabel(c,i){var D=def(c);return i===0?'frè enskripsyon '+D.name:D.unit.toLowerCase()+' '+i}
function myCarnets(t){return S.carnets.filter(function(c){return c.clientId===S.session&&(!t||c.type===t)})}

 if(c.type==='epargne'&&vc===D.n)h+='<div class="note">Pwogram nan fini. Ou dwe resevwa '+fmt(c.plan*1000)+' selon kondisyon yo.</div>';

 if(hist.length)h+='<details><summary class="sm"><b>Istorik ('+hist.length+')</b></summary><div class="sec" style="margin-top:8px">'+hist.map(function(p){return '<div class="row sm" style="justify-content:space-between"><span>'+esc(rangeLabel(c,p))+' · '+fmt(p.amount)+' · '+dstr(p.createdAt)+'</span>'+statusPill(p.status)+'</div>'}).join('')+'</div></details>';
 return h+'</div>'

 if(n==='pay'){

  if(!save()){S.payments.pop();S.notes.shift();S.audit.shift();toast('Pa gen ase espas pou sove foto a. Eseye yon foto ki pi piti.');return}

 if(n==='req-sav'||n==='store-req'){S.requests.push({id:uid('r'),clientId:m.id,type:'sav',store:n==='store-req',text:(n==='req-sav'?g('act')+': ':'')+g('text'),status:'nouvo',createdAt:new Date().toISOString()});audit('Nouvo demann ('+cname(m.id)+')');save();render();toast('Demann voye.');return}

 if(n==='reply'){var rq=S.requests.find(function(r){return r.id===+f.getAttribute('data-id')});rq.reply=g('reply');rq.status='repons';note(rq.clientId,'Administratè a reponn demann #'+rq.id+'.');audit('Repons demann #'+rq.id);save();render();return}
 if(n==='ch-order'){

 if(n==='cart-add'){var p=S.products.find(function(p){return p.id===f.getAttribute('data-id')}),opt=[g('size'),g('color')].filter(Boolean).join(', '),q2=Math.max(1,+g('qty'));
  var ex=S.cart.find(function(i){return i.pid===p.id&&i.opt===opt});if(ex)ex.qty+=q2;else S.cart.push({pid:p.id,name:p.name,opt:opt,price:p.price,qty:q2});save();modal=null;render();toast('Ajoute nan panye.');return}
 if(n==='checkout'){

 if(n==='prod-add'){
